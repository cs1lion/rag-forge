  <text x="78" y="68" fill="#1D4ED8" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" font-weight="700">rag-forge</text>
  <text x="78" y="88" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Full-stack knowledge-base Q&amp;A workbench with citation tracing, injection defense &amp; automated video queue.</text>
  <line x1="28" y1="104" x2="812" y2="104" stroke="#E2E8F0" stroke-width="1"/>
  <text x="28" y="128" fill="#475569" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600">RETRIEVAL</text>
  <text x="122" y="128" fill="#0F172A" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5">Local BM25 + TF-IDF · Subquery decomposition · Rare-term evidence rotation</text>
  <text x="28" y="152" fill="#475569" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600">SECURITY</text>
  <text x="122" y="152" fill="#0F766E" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600">XML isolation + System Prompt defense · Strict JSON Schema · Refusal skips video</text>
  <text x="28" y="176" fill="#475569" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5" font-weight="600">PIPELINE</text>
  <text x="122" y="176" fill="#0F172A" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12.5">FastAPI + SQLite (4 tables) + React 18 · asyncio.Lock FIFO queue + Remotion/FFmpeg</text>
  <g shape-rendering="crispEdges">
