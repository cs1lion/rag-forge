  <text x="313" y="224" text-anchor="middle" fill="#1E3A8A" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">02 · HYBRID RAG</text>
  <text x="511" y="224" text-anchor="middle" fill="#115E59" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">03 · GUARD &amp; CITE</text>
  <text x="717" y="224" text-anchor="middle" fill="#92400E" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">04 · VIDEO QUEUE</text>
