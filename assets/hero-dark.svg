  <text x="420" y="24" text-anchor="middle" fill="#8B949E" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12">cs1lion/rag-forge — hybrid retrieval &amp; video pipeline</text>
  <g shape-rendering="crispEdges">
