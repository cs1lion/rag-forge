  <text x="115" y="224" text-anchor="middle" fill="#C9D1D9" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">01 · INGEST</text>
  <text x="313" y="224" text-anchor="middle" fill="#7DD3FC" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">02 · HYBRID RAG</text>
  <text x="511" y="224" text-anchor="middle" fill="#6EE7B7" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">03 · GUARD &amp; CITE</text>
  <text x="717" y="224" text-anchor="middle" fill="#FCD34D" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13" font-weight="700">04 · VIDEO QUEUE</text>
